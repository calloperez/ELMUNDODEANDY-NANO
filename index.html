<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>El Mundo de Andy&amp;Nano</title>
<meta name="theme-color" content="#1B2A4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --navy:#1B2A4A;
    --navy-dark:#0F1A30;
    --cream:#FFF7E8;
    --sun:#FFC94A;
    --sun-dark:#E8A93A;
    --coral:#FF7A5C;
    --america:#FF7A5C;
    --europa:#4AB3A8;
    --africa:#E8A93A;
    --asia:#C9506B;
    --oceania:#4A9BD1;
    --ink:#1B2A4A;
    --good:#5FBF7A;
    --radius:22px;
    font-size:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
    background:radial-gradient(ellipse at top, #24365E 0%, var(--navy-dark) 70%);
    color:var(--cream);
    overflow:hidden;
    user-select:none;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:24px;
    opacity:0; pointer-events:none;
    transform:scale(0.97);
    transition:opacity .35s ease, transform .35s ease;
  }
  .screen.active{opacity:1; pointer-events:auto; transform:scale(1);}
  .stars{position:absolute; inset:0; overflow:hidden; z-index:0;}
  .stars span{position:absolute; width:3px; height:3px; background:#fff; border-radius:50%; opacity:.5;}

  h1,h2,h3{margin:0; font-weight:800;}
  p{margin:0;}

  /* ---------- Botones grandes ---------- */
  .big-btn{
    background:var(--sun);
    color:var(--navy-dark);
    border:none;
    border-radius:999px;
    padding:18px 34px;
    font-size:1.25rem;
    font-weight:800;
    font-family:inherit;
    box-shadow:0 6px 0 var(--sun-dark);
    cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease;
    display:flex; align-items:center; gap:10px;
    z-index:2;
  }
  .big-btn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--sun-dark);}
  .ghost-btn{
    background:rgba(255,255,255,.12);
    color:var(--cream);
    border:2px solid rgba(255,255,255,.3);
    border-radius:999px;
    padding:10px 20px;
    font-size:1rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }

  /* ---------- Top bar persistente ---------- */
  #topbar{
    position:fixed; top:calc(10px + env(safe-area-inset-top)); left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 14px; z-index:50; pointer-events:none;
  }
  #topbar > *{pointer-events:auto;}
  .icon-btn{
    width:52px; height:52px; border-radius:50%;
    background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.3);
    color:var(--cream);
    font-size:1.4rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #langToggle{font-size:1.6rem;}
  #backBtn{display:none;}

  /* ---------- Splash ---------- */
  #screen-splash .ship{font-size:5rem; animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  #screen-splash h1{font-size:2rem; text-align:center; margin:14px 0 6px;}
  #screen-splash p{opacity:.85; text-align:center; margin-bottom:22px;}

  /* ---------- Mapa mundial real ---------- */
  #screen-continents .prompt{margin-bottom:4px; text-align:center; font-size:1.1rem; font-weight:700; z-index:2;}
  #levelProgress{margin-bottom:10px; text-align:center; font-size:.85rem; opacity:.85; z-index:2; min-height:1.2em;}
  .country.known.locked{ filter:grayscale(1) brightness(.4) !important; }
  #mapControls{
    position:absolute; top:calc(70px + env(safe-area-inset-top)); right:14px;
    display:flex; flex-direction:column; gap:8px; z-index:5;
  }
  #mapControls .icon-btn{width:44px; height:44px; font-size:1.1rem;}
  #mapWrap{
    width:100%; max-width:640px; height:min(62vh,420px);
    border-radius:24px;
    background:radial-gradient(ellipse at 50% 40%, #1E3054, #0F1A30 80%);
    overflow:hidden; position:relative; touch-action:none;
    border:2px solid rgba(255,255,255,.12);
  }
  #mapInner{
    width:100%; height:100%;
    transform-origin:0 0;
    cursor:grab;
  }
  #mapInner svg{width:100%; height:100%; display:block;}
  .country{ fill:#2A3C63; stroke:#0F1A30; stroke-width:0.6; }
  .country.known{ cursor:pointer; stroke:rgba(255,255,255,.6); stroke-width:0.9; }
  .country.known[data-continent="america"]{ fill:var(--america); }
  .country.known[data-continent="europa"]{ fill:var(--europa); }
  .country.known[data-continent="africa"]{ fill:var(--africa); }
  .country.known[data-continent="asia"]{ fill:var(--asia); }
  .country.known[data-continent="oceania"]{ fill:var(--oceania); }
  .country.known{ filter:saturate(.55) brightness(.7); transition:filter .2s; }
  .country.known.discovered{ filter:saturate(1) brightness(1); }
  .country.known.selected{
    filter:saturate(1) brightness(1.25);
    transform-box:fill-box; transform-origin:center;
    animation:countryPulse .5s ease;
  }
  @keyframes countryPulse{ 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }
  .country-flag-label{
    pointer-events:none; /* no interfiere con el toque sobre el país */
    transition:opacity .2s;
  }
  .country-flag-label .flag-badge{
    fill:rgba(255,255,255,.92);
    stroke:rgba(15,20,30,.35);
    stroke-width:0.6;
    filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45));
  }
  .country-flag-label .flag-emoji{
    paint-order:stroke;
  }
  .country-flag-label.locked{ opacity:.4; }
  .country-flag-label.locked .flag-badge{ fill:rgba(255,255,255,.5); }
  #mapToast{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.75); color:#fff; padding:10px 18px; border-radius:14px;
    font-size:.95rem; opacity:0; transition:opacity .25s; pointer-events:none; z-index:6;
    max-width:80%; text-align:center;
  }
  #mapToast.show{opacity:1;}

  /* ---------- Descubrimiento de país ---------- */
  #screen-discover{overflow-y:auto; align-items:flex-start; padding-top:calc(70px + env(safe-area-inset-top)); padding-bottom:30px;}
  #discoverCard{
    background:rgba(255,255,255,.08);
    border-radius:32px;
    padding:30px 26px;
    max-width:480px; width:100%;
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    margin:0 auto;
  }
  #discFlag{font-size:5rem; filter:drop-shadow(0 8px 12px rgba(0,0,0,.4));}
  #discCountry{font-size:1.8rem;}
  #discLine{font-size:1.2rem; min-height:2.6em; opacity:.95; line-height:1.4;}
  #discGuide{font-size:2.2rem;}
  #voiceControls{display:flex; gap:14px; margin-top:6px;}
  #voiceControls .icon-btn{width:46px;height:46px;font-size:1.1rem;}
  #discActions{display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; justify-content:center;}

  /* ---------- Características reveladas debajo (ex "Descubrir más") ---------- */
  #moreGrid{display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; max-width:420px; margin-top:4px;
    opacity:0; max-height:0; overflow:hidden; transition:opacity .5s ease, max-height .5s ease;}
  #moreGrid.show{opacity:1; max-height:600px; margin-top:14px;}
  #illustrationBox{width:100%; max-width:340px; border-radius:20px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.35);
    opacity:0; max-height:0; transition:opacity .5s ease, max-height .5s ease, margin .5s ease;}
  #illustrationBox.show{display:block; opacity:1; max-height:400px; margin-bottom:6px; margin-top:8px;}
  #illustrationBox svg, #illustrationBox img{width:100%; height:auto; display:block; object-fit:contain;}
  #detailPhotoAttribution{font-size:.68rem; opacity:.6; margin-top:4px; text-align:center;}
  #detailSportExtra{display:none; flex-direction:column; align-items:center; gap:4px; margin-top:2px;}
  #detailSportExtra.show{display:flex;}
  #detailSportExtra .shirt-row{display:flex; align-items:center; gap:8px; font-size:1rem; font-weight:700;}
  #detailSportExtra .shirt-label{font-size:.8rem; opacity:.75; font-weight:600;}
  .jersey-svg{width:64px; height:64px;}
  .sport-shirt-container{
    width:100%; aspect-ratio:1/1; max-width:220px;
    background:rgba(255,255,255,.06); border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; margin:0 auto;
  }
  .sport-shirt-image{
    width:78%; height:78%;
    object-fit:contain;
    object-position:center;
    display:block;
  }
  #detailIllustration img{width:100%; height:auto; border-radius:18px; display:block; object-fit:contain;}
  #detailIllustration{max-height:320px;}
  .asset-placeholder{
    width:100%; aspect-ratio:4/3; border-radius:18px;
    background:linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border:2px dashed rgba(255,255,255,.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    text-align:center; padding:14px;
  }
  .asset-placeholder .ph-icon{font-size:2.2rem;}
  .asset-placeholder .ph-text{font-weight:800; font-size:.95rem;}
  .asset-placeholder .ph-soon{font-size:.75rem; opacity:.65;}
  .fact-chip{background:rgba(255,255,255,.1); border-radius:16px; padding:14px; text-align:center; cursor:pointer; transition:transform .12s, background .12s;}
  .fact-chip:active{transform:scale(.95); background:rgba(255,255,255,.18);}
  .fact-chip .emoji{font-size:1.8rem; display:block; margin-bottom:6px;}
  .fact-chip .txt{font-size:.85rem;}

  /* ---------- Modal de detalle (al tocar un chip) ---------- */
  #detailModal{
    position:fixed; inset:0; z-index:80;
    background:rgba(10,15,30,.72);
    display:flex; align-items:center; justify-content:center;
    padding:24px; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  #detailModal.show{opacity:1; pointer-events:auto;}
  #detailCard{
    background:var(--navy); border:2px solid rgba(255,255,255,.15);
    border-radius:28px; padding:30px 26px; max-width:340px; width:100%;
    text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;
    transform:scale(.9); transition:transform .2s ease;
  }
  #detailModal.show #detailCard{transform:scale(1);}
  #detailIllustration{width:100%; border-radius:18px; overflow:hidden; margin-bottom:4px;}
  #detailIllustration svg{width:100%; height:auto; display:block;}
  #detailIllustration.show{margin-bottom:10px;}
  #detailEmoji{font-size:4rem;}
  #detailTitle{font-size:1.4rem; font-weight:800;}
  #detailCategory{font-size:.9rem; opacity:.75;}

  /* ---------- Mini juego ---------- */
  #gamePrompt{font-size:1.25rem; text-align:center; margin-bottom:22px; font-weight:700;}
  #gameOptions{display:flex; flex-direction:column; gap:14px; width:100%; max-width:380px;}
  .opt-btn{
    background:rgba(255,255,255,.1);
    border:3px solid rgba(255,255,255,.25);
    border-radius:18px;
    padding:16px;
    font-family:inherit; font-size:1.3rem; font-weight:700; color:var(--cream);
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .opt-btn.correct{background:var(--good); border-color:var(--good); color:#fff;}
  .opt-btn.wrong{background:var(--coral); border-color:var(--coral); color:#fff;}
  #gameFeedback{margin-top:16px; font-size:1.1rem; font-weight:700; min-height:1.6em;}

  /* ---------- Celebración ---------- */
  #screen-celebrate .stamp{font-size:6rem; animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{0%{transform:scale(0) rotate(-25deg)}70%{transform:scale(1.15) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #screen-celebrate h2{margin-top:12px; text-align:center;}

  /* ---------- Pasaporte ---------- */
  #passportGrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; width:100%; max-width:460px; overflow-y:auto; max-height:60vh; padding:6px;}
  .pass-tile{aspect-ratio:1; border-radius:14px; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; font-size:1.8rem; position:relative;}
  .pass-tile.empty{filter:grayscale(1) opacity(.35);}
  .pass-tile .stars{position:static; font-size:.55rem; position:absolute; bottom:2px; letter-spacing:1px;}

  /* ---------- Cierre de sesión ---------- */
  #screen-pause .big-btn{margin-top:22px;}

  /* ---------- Modo padres ---------- */
  #screen-gate input{
    font-size:1.4rem; text-align:center; width:120px; padding:10px;
    border-radius:12px; border:none; margin:14px 0; font-family:inherit;
  }
  .parent-panel{background:rgba(255,255,255,.06); border-radius:20px; padding:18px; width:100%; max-width:460px; margin-bottom:14px; max-height:70vh; overflow-y:auto;}
  .parent-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.1); font-size:.95rem;}
  .parent-row:last-child{border-bottom:none;}
  .switch-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0;}
  .toggle{width:52px; height:30px; border-radius:20px; background:rgba(255,255,255,.2); position:relative; cursor:pointer; border:none;}
  .toggle.on{background:var(--good);}
  .toggle::after{content:''; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .15s;}
  .toggle.on::after{left:25px;}
  #screen-parent h2, #screen-parentSettings h2{margin-bottom:14px;}
  .tabs{display:flex; gap:10px; margin-bottom:14px;}
  .tab-btn{background:rgba(255,255,255,.08); border:none; border-radius:14px; padding:8px 16px; color:var(--cream); font-family:inherit; font-weight:700; cursor:pointer;}
  .tab-btn.active{background:var(--sun); color:var(--navy-dark);}

  .lvl-dots{display:flex; gap:3px;}
  .lvl-dots span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);}
  .lvl-dots span.on{background:var(--sun);}

  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2); border-radius:3px;}

  @media (max-width:360px){ :root{font-size:16px;} }
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <button id="backBtn" class="icon-btn" title="Volver">←</button>
    <div style="flex:1"></div>
    <button id="passportBtn" class="icon-btn" title="Pasaporte">📘</button>
    <button id="musicToggleBtn" class="icon-btn" title="Música">🎵</button>
    <button id="langToggle" class="icon-btn" title="Idioma">🇪🇸</button>
    <button id="gateOpenBtn" class="icon-btn" title="Modo padres" style="opacity:.35; font-size:1rem;">⚙️</button>
  </div>

  <!-- SPLASH -->
  <section id="screen-splash" class="screen active">
    <div class="ship">🚀</div>
    <h1 data-i18n="splash_title">¡Hola! Somos Andy y Nano</h1>
    <p data-i18n="splash_sub">¿Querés descubrir el mundo con nosotros?</p>
    <button class="big-btn" id="startBtn">🌎 <span data-i18n="start_btn">Comenzar aventura</span></button>
  </section>

  <!-- MAPA MUNDIAL REAL -->
  <section id="screen-continents" class="screen" style="padding:12px;">
    <p class="prompt" data-i18n="pick_continent">¡Tocá un país para descubrirlo!</p>
    <div id="levelProgress"></div>
    <div id="mapControls">
      <button class="icon-btn" id="zoomInBtn">➕</button>
      <button class="icon-btn" id="zoomOutBtn">➖</button>
      <button class="icon-btn" id="zoomResetBtn">🌎</button>
    </div>
    <div id="mapWrap">
      <div id="mapInner">

    <div id="mapToast"></div>
  </section>

  <!-- DESCUBRIMIENTO -->
  <section id="screen-discover" class="screen">
    <div id="discoverCard">
      <div id="discFlag"></div>
      <div id="discCountry"></div>
      <div id="discLine"></div>
      <div id="voiceControls">
        <button class="icon-btn" id="voicePlayBtn">🔊</button>
        <button class="icon-btn" id="voiceMuteBtn">🔇</button>
      </div>
      <div id="illustrationBox"></div>
      <div id="moreGrid"></div>
      <div id="discActions">
        <button class="big-btn" id="playGameBtn">🎮 <span data-i18n="play_btn">¡Jugar!</span></button>
      </div>
    </div>
  </section>

  <!-- MINIJUEGO -->
  <section id="screen-game" class="screen">
    <div id="gameFlagBig" style="font-size:4rem; margin-bottom:6px;"></div>
    <p id="gamePrompt"></p>
    <div id="gameOptions"></div>
    <div id="gameFeedback"></div>
  </section>

  <!-- CELEBRACION -->
  <section id="screen-celebrate" class="screen">
    <div class="stamp">🎉</div>
    <h2 data-i18n="celebrate_title">¡Muy bien! Nuevo sello</h2>
    <p id="celebrateCountry" style="margin-top:6px; font-size:1.3rem;"></p>
    <button class="big-btn" id="celebrateContinueBtn" style="margin-top:24px;" data-i18n="continue_btn">Seguir viajando</button>
  </section>

  <!-- PASAPORTE -->
  <section id="screen-passport" class="screen">
    <h2 style="margin-bottom:14px;" data-i18n="passport_title">Pasaporte del explorador</h2>
    <div id="passportGrid"></div>
    <button class="big-btn" id="passportBackBtn" style="margin-top:18px;" data-i18n="back_btn">Volver al mapa</button>
  </section>

  <!-- PAUSA / CIERRE DE SESION -->
  <section id="screen-pause" class="screen">
    <div style="font-size:3.5rem;">🚀✨</div>
    <h2 data-i18n="pause_title">¡Qué gran viaje!</h2>
    <p id="pauseSummary" style="margin-top:8px; text-align:center;"></p>
    <button class="big-btn" id="pauseContinueBtn" data-i18n="pause_continue">Seguir explorando</button>
    <button class="ghost-btn" id="pauseExitBtn" style="margin-top:12px;" data-i18n="pause_exit">Descansar por hoy</button>
  </section>

  <!-- BARRERA MODO PADRES -->
  <section id="screen-gate" class="screen">
    <h2 data-i18n="gate_title">Modo padres</h2>
    <p id="gateQuestion" style="margin-top:10px;"></p>
    <input type="number" id="gateInput" inputmode="numeric">
    <div style="display:flex; gap:10px;">
      <button class="big-btn" id="gateSubmit" data-i18n="gate_enter">Entrar</button>
      <button class="ghost-btn" id="gateCancel" data-i18n="gate_cancel">Cancelar</button>
    </div>
  </section>

  <!-- PANEL PADRES -->
  <section id="screen-parent" class="screen">
    <h2 data-i18n="parent_panel_title">Progreso</h2>
    <div class="tabs">
      <button class="tab-btn active" id="tabProgress" data-i18n="tab_progress">Progreso</button>
      <button class="tab-btn" id="tabSettings" data-i18n="tab_settings">Ajustes</button>
    </div>
    <div class="parent-panel" id="progressPanel"></div>
    <button class="ghost-btn" id="parentExitBtn" data-i18n="back_btn">Volver al mapa</button>
  </section>

  <!-- AJUSTES PADRES -->
  <section id="screen-parentSettings" class="screen">
    <h2 data-i18n="settings_title">Ajustes</h2>
    <div class="parent-panel">
      <div class="switch-row"><span data-i18n="setting_sound">Sonido</span><button class="toggle on" id="soundToggle"></button></div>
      <div class="switch-row"><span data-i18n="setting_music">Música de fondo</span><button class="toggle on" id="musicSettingToggle"></button></div>
      <div class="switch-row"><span data-i18n="setting_contrast">Alto contraste</span><button class="toggle" id="contrastToggle"></button></div>
      <div class="switch-row"><span data-i18n="setting_bigtext">Texto grande</span><button class="toggle" id="bigTextToggle"></button></div>
      <div class="switch-row"><span data-i18n="setting_reduce">Reducir animaciones</span><button class="toggle" id="reduceMotionToggle"></button></div>
    </div>
    <button class="ghost-btn" id="resetProgressBtn" data-i18n="reset_progress">Reiniciar progreso</button>
    <button class="ghost-btn" id="settingsBackBtn" style="margin-top:10px;" data-i18n="back_btn">Volver al mapa</button>
  </section>

  <!-- MODAL DE DETALLE: se abre al tocar cualquier chip (animal/comida/lugar/cultura) -->
  <div id="detailModal">
    <div id="detailCard">
      <div id="detailIllustration"></div>
      <div id="detailEmoji"></div>
      <div id="detailTitle"></div>
      <div id="detailCategory"></div>
      <div id="detailSportExtra"></div>
      <div id="detailPhotoAttribution"></div>
    </div>
  </div>

</div>

<script src="data.js"></script>
<script src="music.js"></script>
<script src="illustrations.js"></script>
<script src="photos.js"></script>
<script src="sports.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
